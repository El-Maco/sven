[package]
edition = "2021"
name = "sven-esp32"
version = "0.2.0"

[[bin]]
name = "sven-esp32"
path = "./src/bin/main.rs"

[dependencies]
embassy-net = { version = "0.6.0", features = [
    "tcp",
    "udp",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv6",
    "log",
    "dns",
] }
esp-alloc = { version = "0.6.0" }
esp-backtrace = { version = "0.15.1", features = [
    "esp32s3",
    "exception-handler",
    "panic-handler",
    "println",
] }
esp-hal = { version = "0.23.1", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.13.0", features = ["esp32s3", "log"] }
esp-wifi = { version = "0.12.0", default-features = false, features = [
    "esp32s3",
    "wifi",
    "esp-alloc",
    "log",
    "smoltcp",
] }
heapless = "0.8.0"
log = { version = "0.4.22" }
smoltcp = { version = "0.12.0", default-features = false, features = [
    "medium-ethernet",
    "proto-dhcpv4",
    "proto-dns",
    "proto-ipv4",
    "socket-dns",
    "socket-icmp",
    "socket-raw",
    "socket-tcp",
    "socket-udp",
] }
critical-section = "1.2.0"
embassy-executor = { version = "0.7.0", features = ["task-arena-size-131072"] }
embassy-sync = "0.6.2"
embassy-time = "0.4.0"
esp-hal-embassy = { version = "0.6.0", features = ["esp32s3"] }
picoserve = { version = "0.17.1", features = ["embassy", "json", "log"] }
serde = { version = "1.0.210", default-features = false, features = ["derive"] }
serde-json-core = "0.6"
static_cell = { version = "2.1.0", features = ["nightly"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
